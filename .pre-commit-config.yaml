repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: check-feature-branch
        name: Enforce feature branch workflow
        entry: python .cursor/check-branch.py
        language: system
        pass_filenames: false
        always_run: true
